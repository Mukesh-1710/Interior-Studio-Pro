<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .project-info {
            margin-bottom: 30px;
        }

        .project-info p {
            margin: 5px 0;
        }

        .room-card {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            page-break-inside: avoid;
        }

        .room-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            padding: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .total-row {
            font-weight: bold;
            text-align: right;
        }

        .grand-total {
            font-size: 1.5em;
            font-weight: bold;
            text-align: right;
            margin-top: 40px;
            border-top: 2px solid #333;
            padding-top: 10px;
        }

        .text-right {
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>INTERIOR COST SHEET / INVOICE</h1>
    </div>

    <div class="project-info">
        <p><strong>Project Name:</strong> <span th:text="${project.projectName}">Project A</span></p>
        <p><strong>Client Name:</strong> <span th:text="${project.clientName}">Client Name</span></p>
        <p><strong>Date:</strong> <span th:text="${project.date}">2026-01-29</span></p>
    </div>

    <div th:each="room : ${project.rooms}" class="room-card">
        <div class="room-title" th:text="${room.roomName}">Living Room</div>
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Item</th>
                    <th>Dimension (L x W)</th>
                    <th>Qty</th>
                    <th>Unit</th>
                    <th>Rate</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item, iterStat : ${room.items}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${item.itemName}">Item Name</td>
                    <td>
                        <span th:if="${item.unit == 'sq.ft'}"
                            th:text="${(item.length != null ? item.length : 0) + ' x ' + (item.width != null ? item.width : 0)}">10
                            x 10</span>
                        <span th:if="${item.unit == 'no.'}">-</span>
                    </td>
                    <td th:text="${item.qty}">100</td>
                    <td th:text="${item.unit}">sq.ft</td>
                    <td th:text="${#numbers.formatDecimal(item.rate, 1, 2)}">100.00</td>
                    <td class="text-right" th:text="${#numbers.formatDecimal(item.amount, 1, 2)}">10000.00</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="6" class="text-right"><strong>Room Total</strong></td>
                    <td class="text-right"><strong
                            th:text="${#numbers.formatDecimal(room.roomTotal, 1, 2)}">10000.00</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="grand-total">
        Grand Total: <span th:text="${#numbers.formatDecimal(project.grandTotal, 1, 2)}">10000.00</span>
    </div>
</body>

</html>
